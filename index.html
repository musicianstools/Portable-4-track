<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#121110">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pocket Four-Track</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="4-Track">
<meta name="application-name" content="4-Track">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121110'/%3E%3Ccircle cx='22' cy='32' r='9' fill='none' stroke='%23f0a33a' stroke-width='4'/%3E%3Ccircle cx='42' cy='32' r='9' fill='none' stroke='%23f0a33a' stroke-width='4'/%3E%3Ccircle cx='32' cy='52' r='4' fill='%23e2463a'/%3E%3C/svg%3E">
<style>
/* ===== Pocket Four-Track — vintage four-track, modern clarity ===== */
:root {
  --bg: #121110; --panel: #1b1917; --panel2: #23201d; --line: #2e2a26; --line2: #3a352f;
  --ink: #ece4d6; --ink2: #b6ab9a; --ink3: #7d7467;
  --amber: #f0a33a; --amber-glow: rgba(240,163,58,.55); --red: #e2463a; --red-glow: rgba(255,80,60,.7); --green: #8dc77b;
  --metal-1: #34302b; --metal-2: #26231f;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: ui-sans-serif, -apple-system, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --head-w: 112px;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); overscroll-behavior: none; }
body { overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--ink); }
svg { display: block; }
[hidden] { display: none !important; }

.app { height: 100dvh; width: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); padding: var(--sat) var(--sar) 0 var(--sal); overflow: hidden; }
.app > * { min-width: 0; }
@media (max-width: 420px) { .save-state span { display: none; } .title-actions .icon-btn { width: 34px; } }

/* ---------- deck ---------- */
.deck {
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px),
    linear-gradient(180deg, var(--metal-1), var(--metal-2));
  border-bottom: 1px solid #0a0908; box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 2px 10px rgba(0,0,0,.4);
  padding: 6px 10px 8px; display: flex; flex-direction: column; gap: 7px; position: relative; z-index: 3;
}
.deck-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.title-btn { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; height: 36px; padding: 0 4px; text-align: left; }
.proj-name { font-weight: 650; font-size: 16px; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { width: 12px; height: 12px; color: var(--ink3); flex: none; }
.reel { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--amber); flex: none; position: relative; opacity: .9; }
.reel::after { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: var(--amber); opacity: .5; }
.app.rolling .reel { animation: spin 1.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.save-state { display: flex; align-items: center; gap: 6px; font: 600 10px/1 var(--mono); letter-spacing: .08em; color: var(--ink3); text-transform: uppercase; white-space: nowrap; }
.title-actions { display: flex; gap: 2px; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--ink2); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn:active { background: rgba(255,255,255,.06); }
.icon-btn:disabled { opacity: .3; }

.led { width: 8px; height: 8px; border-radius: 50%; background: #3a332c; box-shadow: inset 0 1px 1px rgba(0,0,0,.6); display: inline-block; flex: none; }
.led-sm { width: 6px; height: 6px; margin-right: 4px; }
.led.on.led-red, .led-red.on { background: #ff5a48; box-shadow: 0 0 8px var(--red-glow), inset 0 -1px 1px rgba(0,0,0,.3); }
.led.on.led-amber, .led-amber.on { background: #ffbb55; box-shadow: 0 0 8px var(--amber-glow); }
.led.on.led-green, .led-green.on { background: #9fe08c; box-shadow: 0 0 6px rgba(150,230,130,.5); }
.led.blink { animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }

/* counter — tape-counter window */
.deck-main { gap: 12px; }
.counter-window {
  flex: 1; min-width: 0; background: linear-gradient(180deg, #0b0a09, #15130f); border-radius: 10px; padding: 6px 12px 6px;
  box-shadow: inset 0 2px 6px rgba(0,0,0,.8), inset 0 0 0 1px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.07);
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px; position: relative; overflow: hidden;
}
.counter-window::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.04), transparent 45%); pointer-events: none; }
.counter-digits { font: 600 34px/1.05 var(--mono); color: var(--amber); letter-spacing: .04em; font-variant-numeric: tabular-nums; text-shadow: 0 0 10px rgba(240,163,58,.35); }
.counter-window.rec .counter-digits { color: #ff7262; text-shadow: 0 0 12px rgba(255,90,72,.45); }
.counter-sub { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; font: 600 12px/1 var(--mono); color: #c98a32; font-variant-numeric: tabular-nums; }
.cstate { font-size: 10px; letter-spacing: .14em; color: var(--ink3); }
.counter-window.rec .cstate { color: #ff7262; }
.lamps { display: flex; gap: 12px; align-items: center; }
.lamp { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.lamp label { font: 700 9px/1 var(--mono); letter-spacing: .12em; color: var(--ink3); display: flex; align-items: center; }
.lamp .led { width: 12px; height: 12px; }
.meter { width: 10px; height: 34px; border-radius: 3px; background: #0b0a09; box-shadow: inset 0 1px 3px rgba(0,0,0,.8); position: relative; overflow: hidden; }
.meter-fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: linear-gradient(0deg, #6fbf6a 0%, #c9c35a 70%, #f0a33a 85%, #ff5a48 100%); background-size: 100% 34px; background-position: bottom; }
.meter.dead { opacity: .35; }

/* tool chips */
.deck-tools { gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -10px; padding: 0 10px; }
.deck-tools::-webkit-scrollbar { display: none; }
.spacer { flex: 1; }
.chip {
  height: 34px; padding: 0 10px; border-radius: 8px; display: flex; align-items: center; gap: 6px; flex: none; white-space: nowrap;
  font: 700 11px/1 var(--mono); letter-spacing: .08em; color: var(--ink2);
  background: linear-gradient(180deg, #3a3530, #2a2622); box-shadow: 0 1px 0 rgba(255,255,255,.07) inset, 0 2px 3px rgba(0,0,0,.45), 0 0 0 1px #0d0c0b;
}
.chip b { color: var(--ink); font-size: 13px; letter-spacing: .02em; }
.chip small { font-size: 9px; color: var(--ink3); letter-spacing: .1em; }
.chip .sep { width: 1px; height: 14px; background: var(--line2); }
.chip:active, .key:active { transform: translateY(1px); box-shadow: 0 0 0 1px #0d0c0b, inset 0 2px 4px rgba(0,0,0,.5); }
.chip.toggle.on { color: var(--ink); }
.chip.toggle.on .led { background: #ffbb55; box-shadow: 0 0 7px var(--amber-glow); }
.chip.zoom { width: 34px; justify-content: center; padding: 0; font-size: 16px; }

/* ---------- views ---------- */
.views { position: relative; min-height: 0; }
.view { position: absolute; inset: 0; display: none; overflow: auto; -webkit-overflow-scrolling: touch; }
.view.active { display: block; }
.view-studio.active { display: flex; flex-direction: column; overflow: hidden; }
.studio { flex: 1; display: grid; grid-template-columns: var(--head-w) minmax(0, 1fr); min-height: 0; }
.track-heads { display: grid; grid-template-rows: 28px repeat(4, 1fr); background: var(--panel); border-right: 1px solid #0b0a09; box-shadow: 2px 0 6px rgba(0,0,0,.35); z-index: 2; min-height: 0; }
.th-ruler { border-bottom: 1px solid #0b0a09; background: #26231f; display: flex; align-items: center; justify-content: center; font: 700 9px var(--mono); letter-spacing: .14em; color: var(--ink3); }
.th { border-bottom: 1px solid #0b0a09; padding: 6px 7px 6px 9px; display: flex; flex-direction: column; justify-content: center; gap: 6px; min-height: 0; overflow: hidden; position: relative; }
.th::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c); opacity: .9; }
.th-top { display: flex; align-items: center; gap: 6px; min-width: 0; }
.tnum { font: 700 11px/1 var(--mono); color: var(--c); flex: none; }
.tname { flex: 1; min-width: 0; text-align: left; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 0; }
.tset { width: 26px; height: 26px; border-radius: 7px; color: var(--ink3); display: grid; place-items: center; flex: none; font-size: 15px; }
.th-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.tb { height: 28px; border-radius: 6px; font: 800 11px/1 var(--mono); color: var(--ink3); background: linear-gradient(180deg, #34302b, #26231f); box-shadow: 0 0 0 1px #0d0c0b, inset 0 1px 0 rgba(255,255,255,.06); }
.tb:active { box-shadow: 0 0 0 1px #0d0c0b, inset 0 2px 3px rgba(0,0,0,.5); }
.tb.arm.on { color: #fff; background: linear-gradient(180deg, #d4473a, #a83429); box-shadow: 0 0 0 1px #4a1510, 0 0 10px rgba(255,80,60,.35); }
.tb.arm.on.live { animation: armpulse 1s ease-in-out infinite; }
@keyframes armpulse { 50% { box-shadow: 0 0 0 1px #4a1510, 0 0 16px rgba(255,80,60,.75); } }
.tb.mute.on { color: #1a1510; background: linear-gradient(180deg, #e6b456, #c48d2c); }
.tb.solo.on { color: #10161a; background: linear-gradient(180deg, #9cc0e8, #6f93bd); }
.th-fader { display: flex; align-items: center; gap: 6px; }
.th-fader label { font: 700 8.5px var(--mono); color: var(--ink3); letter-spacing: .1em; width: 18px; }
.th-pan { display: none; }
.th.short .th-fader { display: none; }
.th.tiny .th-btns { display: none; }

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 0; touch-action: none; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--c, var(--amber)) var(--v, 50%), #0b0a09 var(--v, 50%)); box-shadow: inset 0 1px 2px rgba(0,0,0,.6); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: #0b0a09; }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--c, var(--amber)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 18px; border-radius: 3px; margin-top: -7px; background: linear-gradient(180deg, #f2ece1, #b9b0a2); box-shadow: 0 1px 3px rgba(0,0,0,.6), inset 0 -2px 0 rgba(0,0,0,.15); }
input[type=range]::-moz-range-thumb { width: 14px; height: 18px; border-radius: 3px; border: 0; background: linear-gradient(180deg, #f2ece1, #b9b0a2); box-shadow: 0 1px 3px rgba(0,0,0,.6); }

.timeline-wrap { position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; }
#timeline { position: absolute; inset: 0; display: block; touch-action: none; }
.countin { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; background: rgba(18,17,16,.35); }
.countin span { font: 700 96px/1 var(--mono); color: #ff7262; text-shadow: 0 0 30px rgba(255,90,72,.5); }
.countin small { font: 700 11px var(--mono); letter-spacing: .3em; color: var(--ink2); margin-top: 6px; }
.empty-hint { position: absolute; left: 0; right: 0; top: 46%; text-align: center; color: var(--ink3); font-size: 14px; line-height: 1.6; pointer-events: none; padding: 0 16px; }
.empty-hint b { color: var(--red); }

.clipbar { display: flex; gap: 6px; padding: 8px 10px; background: var(--panel2); border-top: 1px solid #0b0a09; overflow-x: auto; }
.clipbar button { height: 38px; padding: 0 14px; border-radius: 9px; background: linear-gradient(180deg, #3a3530, #2a2622); box-shadow: 0 0 0 1px #0d0c0b, inset 0 1px 0 rgba(255,255,255,.06); font-weight: 600; font-size: 13px; white-space: nowrap; flex: none; }
.clipbar button b { color: var(--amber); margin-left: 3px; }
.clipbar .danger { color: #ff8576; }
.clipbar .x { margin-left: auto; width: 38px; padding: 0; }

/* ---------- transport ---------- */
.transport-dock { background: linear-gradient(180deg, #2a2622, #1a1816); border-top: 1px solid #0b0a09; box-shadow: 0 -2px 10px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.05); padding-bottom: var(--sab); z-index: 3; }
.transport { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding: 9px 10px 7px; max-width: 640px; margin: 0 auto; }
.key {
  height: 54px; border-radius: 10px; display: grid; place-items: center; color: #d8cfc0;
  background: linear-gradient(180deg, #4a443d 0%, #37322c 48%, #2c2824 52%, #26221f 100%);
  box-shadow: 0 0 0 1px #0a0908, inset 0 1px 0 rgba(255,255,255,.12), 0 3px 0 #0d0c0b, 0 5px 8px rgba(0,0,0,.35);
  transition: transform .05s;
}
.key svg { width: 22px; height: 22px; }
.key:active, .key.down { transform: translateY(3px); box-shadow: 0 0 0 1px #0a0908, inset 0 2px 5px rgba(0,0,0,.55), 0 0 0 #000; }
.key.lit { color: var(--amber); }
.key.lit svg { filter: drop-shadow(0 0 5px var(--amber-glow)); }
.key-rec { color: #ff5a48; background: linear-gradient(180deg, #5a2a24 0%, #45201b 48%, #3a1a16 52%, #321613 100%); }
.key-rec.lit { color: #ff6a58; animation: recglow 1.1s ease-in-out infinite; }
@keyframes recglow { 50% { box-shadow: 0 0 0 1px #0a0908, 0 0 18px rgba(255,80,60,.55), inset 0 2px 5px rgba(0,0,0,.55); } }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); max-width: 640px; margin: 0 auto; }
.tabs button { height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 10.5px; font-weight: 600; color: var(--ink3); letter-spacing: .03em; }
.tabs svg { width: 21px; height: 21px; }
.tabs button.active { color: var(--amber); }

/* ---------- pages (projects/tools/settings) ---------- */
.page { max-width: 720px; margin: 0 auto; padding: 14px 14px 30px; }
.page h1 { font-size: 22px; margin: 6px 2px 14px; letter-spacing: -.01em; }
.page h3 { font: 700 11px var(--mono); letter-spacing: .14em; color: var(--ink3); text-transform: uppercase; margin: 22px 4px 8px; }
.card { background: var(--panel); border-radius: 14px; box-shadow: 0 0 0 1px #0b0a09, inset 0 1px 0 rgba(255,255,255,.04); padding: 14px; margin-bottom: 12px; }
.row { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.row + .row { border-top: 1px solid var(--line); }
.row > label, .row > .lbl { flex: 1; font-size: 14.5px; }
.row small, .muted { color: var(--ink3); font-size: 12.5px; line-height: 1.45; }
.btn { height: 42px; padding: 0 16px; border-radius: 10px; font-weight: 650; font-size: 14px; background: linear-gradient(180deg, #3e3933, #2c2824); box-shadow: 0 0 0 1px #0b0a09, inset 0 1px 0 rgba(255,255,255,.07); white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: linear-gradient(180deg, #f3ad4a, #d88e25); color: #1a1208; box-shadow: 0 0 0 1px #5a3a0c, inset 0 1px 0 rgba(255,255,255,.3); }
.btn.danger { color: #ff8576; }
.btn.danger-fill { background: linear-gradient(180deg, #d4473a, #a83429); color: #fff; }
.btn.small { height: 34px; padding: 0 12px; font-size: 13px; }
.btn:disabled { opacity: .4; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
select, input[type=text], input[type=search], input[type=number], textarea {
  background: #0f0e0d; border: 1px solid var(--line2); border-radius: 9px; height: 40px; padding: 0 10px; font-size: 15px; outline: none; min-width: 0;
}
textarea { height: auto; padding: 10px; line-height: 1.5; resize: vertical; width: 100%; -webkit-user-select: text; user-select: text; }
input[type=text], input[type=search] { -webkit-user-select: text; user-select: text; }
select:focus, input:focus, textarea:focus { border-color: var(--amber); }
.switch { position: relative; width: 48px; height: 28px; flex: none; }
.switch input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; z-index: 1; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 14px; background: #0f0e0d; box-shadow: inset 0 0 0 1px var(--line2); transition: .15s; }
.switch span::after { content: ''; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #8a8173; transition: .15s; }
.switch input:checked + span { background: #5a3d14; box-shadow: inset 0 0 0 1px #8a5e1c; }
.switch input:checked + span::after { left: 23px; background: var(--amber); box-shadow: 0 0 8px var(--amber-glow); }
.seg { display: inline-flex; background: #0f0e0d; border-radius: 9px; padding: 3px; gap: 2px; box-shadow: inset 0 0 0 1px var(--line2); flex-wrap: wrap; }
.seg button { height: 34px; padding: 0 11px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--ink2); }
.seg button.on { background: #3a342d; color: var(--amber); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }

/* project list */
.plist-tools { display: flex; gap: 8px; margin-bottom: 12px; }
.plist-tools input { flex: 1; }
.pitem { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: var(--panel); box-shadow: 0 0 0 1px #0b0a09; margin-bottom: 8px; }
.pitem.current { box-shadow: 0 0 0 1px #7a5418, inset 3px 0 0 var(--amber); }
.pitem .pmain { flex: 1; min-width: 0; text-align: left; }
.pitem .pname { font-weight: 650; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pitem .pmeta { color: var(--ink3); font-size: 12px; margin-top: 3px; }
.cassette { width: 42px; height: 28px; border-radius: 4px; background: #2c2824; box-shadow: inset 0 0 0 1px #45403a; flex: none; position: relative; }
.cassette::before, .cassette::after { content: ''; position: absolute; top: 8px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--amber); opacity: .8; }
.cassette::before { left: 7px; } .cassette::after { right: 7px; }
.storage-bar { height: 8px; border-radius: 4px; background: #0f0e0d; overflow: hidden; margin: 8px 0; }
.storage-bar i { display: block; height: 100%; background: var(--amber); }

/* tuner */
.tuner { text-align: center; padding: 8px 0 4px; }
.tuner-note { font: 700 84px/1 var(--mono); color: var(--ink); min-height: 88px; }
.tuner-note sup { font-size: 26px; color: var(--ink3); margin-left: 4px; }
.tuner-note.in { color: var(--green); text-shadow: 0 0 20px rgba(140,200,120,.4); }
.tuner-freq { font: 600 13px var(--mono); color: var(--ink3); margin: 6px 0 14px; }
.tuner-meter { position: relative; height: 54px; margin: 0 8px; }
.tuner-scale { position: absolute; left: 0; right: 0; top: 0; height: 30px; background: repeating-linear-gradient(90deg, #4a443d 0 1px, transparent 1px 10%); }
.tuner-center { position: absolute; left: 50%; top: -4px; width: 2px; height: 38px; background: var(--green); transform: translateX(-1px); box-shadow: 0 0 6px rgba(140,200,120,.6); }
.tuner-needle { position: absolute; top: 0; width: 4px; height: 30px; border-radius: 2px; background: var(--amber); left: 50%; transform: translateX(-2px); transition: left .08s linear; box-shadow: 0 0 8px var(--amber-glow); }
.tuner-labels { position: absolute; left: 0; right: 0; top: 36px; display: flex; justify-content: space-between; font: 600 11px var(--mono); color: var(--ink3); }
.tuner-state { font: 700 12px var(--mono); letter-spacing: .14em; color: var(--ink3); margin-top: 6px; min-height: 16px; }
.tap-pad { width: 100%; height: 120px; border-radius: 16px; font: 700 18px var(--mono); letter-spacing: .2em; color: var(--ink2); background: linear-gradient(180deg, #3a3530, #26231f); box-shadow: 0 0 0 1px #0b0a09, inset 0 1px 0 rgba(255,255,255,.06), 0 4px 0 #0d0c0b; }
.tap-pad:active { transform: translateY(3px); box-shadow: 0 0 0 1px #0b0a09, inset 0 2px 6px rgba(0,0,0,.5); }
.tap-pad b { display: block; font-size: 40px; color: var(--amber); letter-spacing: 0; margin-bottom: 4px; }
.pat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.pat-grid button { height: 46px; border-radius: 10px; font-size: 13px; font-weight: 600; background: #0f0e0d; box-shadow: inset 0 0 0 1px var(--line2); text-align: left; padding: 0 12px; color: var(--ink2); }
.pat-grid button.on { color: var(--amber); box-shadow: inset 0 0 0 1px #8a5e1c; background: #2a2117; }
.bignum { display: flex; align-items: center; gap: 8px; }
.bignum input { width: 84px; text-align: center; font: 700 22px var(--mono); height: 48px; }
.kbd { font: 600 12px var(--mono); background: #0f0e0d; border: 1px solid var(--line2); border-radius: 5px; padding: 2px 6px; color: var(--ink2); }
.shortcuts { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13.5px; color: var(--ink2); align-items: center; }

/* ---------- sheet ---------- */
.sheet-host { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet-scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); animation: fade .15s; }
.sheet { position: relative; width: 100%; max-width: 560px; max-height: 88dvh; display: flex; flex-direction: column; background: var(--panel2); border-radius: 18px 18px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06); padding-bottom: var(--sab); animation: up .2s cubic-bezier(.2,.8,.2,1); }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
.sheet-grip { width: 40px; height: 5px; border-radius: 3px; background: #4a443d; margin: 8px auto 0; }
.sheet-head { display: flex; align-items: center; padding: 6px 10px 4px 18px; }
.sheet-head h2 { flex: 1; font-size: 17px; margin: 0; }
.sheet-body { overflow: auto; padding: 6px 16px 18px; -webkit-overflow-scrolling: touch; }
.sheet-body .card { background: var(--panel); }
.sheet-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
.take { display: flex; align-items: center; gap: 8px; padding: 8px 4px; border-top: 1px solid var(--line); }
.take:first-child { border-top: 0; }
.take .radio { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line2); flex: none; display: grid; place-items: center; }
.take.active .radio { box-shadow: inset 0 0 0 2px var(--amber); }
.take.active .radio::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--amber); }
.take .tmain { flex: 1; min-width: 0; text-align: left; padding: 6px 0; }
.take .tname2 { font-weight: 600; font-size: 14.5px; }
.take .tmeta { font-size: 12px; color: var(--ink3); margin-top: 2px; }
.take .star { font-size: 18px; color: var(--ink3); width: 36px; height: 36px; }
.take .star.on { color: var(--amber); }
.fxgrid { display: grid; grid-template-columns: 74px 1fr 44px; gap: 6px 10px; align-items: center; font-size: 13.5px; }
.fxgrid output { font: 600 12px var(--mono); color: var(--ink2); text-align: right; }
.note-box { background: #2a1d12; border: 1px solid #5a3d14; color: #f2c98a; border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.45; margin: 8px 0; }

/* ---------- toasts ---------- */
.toast-host { position: fixed; left: 0; right: 0; bottom: calc(196px + var(--sab)); display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 30; pointer-events: none; padding: 0 12px; }
.sheet-open .toast-host { bottom: auto; top: calc(var(--sat) + 10px); }
.toast { pointer-events: auto; max-width: 520px; background: #f1e9db; color: #1b1712; font-size: 14px; font-weight: 550; padding: 11px 14px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.45); display: flex; gap: 12px; align-items: center; animation: up .2s; }
.toast.err { background: #ffd9d3; color: #4a0f08; }
.toast button { font-weight: 750; color: #8a4e0a; white-space: nowrap; }

/* ---------- larger screens ---------- */
@media (min-width: 760px) {
  :root { --head-w: 210px; }
  .deck { padding: 8px 16px 10px; }
  .deck-main { display: contents; }
  .deck { display: grid; grid-template-columns: 1fr auto auto; grid-template-areas: "title counter lamps" "tools tools tools"; column-gap: 16px; }
  .deck-title { grid-area: title; } .counter-window { grid-area: counter; width: 290px; flex: none; } .lamps { grid-area: lamps; } .deck-tools { grid-area: tools; margin: 0; padding: 0; }
  .th-pan { display: flex; }
  .th { padding: 8px 10px 8px 12px; }
  .transport { gap: 10px; }
}
@media (min-width: 1100px) { .counter-window { width: 340px; } .counter-digits { font-size: 40px; } }
@media (max-height: 640px) and (max-width: 759px) {
  .counter-digits { font-size: 28px; } .key { height: 46px; } .tabs button { height: 40px; } .deck { gap: 5px; }
}
@media (hover: hover) { .chip:hover, .key:hover, .btn:hover { filter: brightness(1.08); } }

<script>
'use strict';
/* ===== Pocket Four-Track — utilities: ids, formatting, WAV, ZIP ===== */

const APP_VERSION = '1.0.1';
const FORMAT_VERSION = 1;

function uid(prefix = '') {
  const a = new Uint8Array(10);
  crypto.getRandomValues(a);
  return prefix + Array.from(a, b => b.toString(16).padStart(2, '0')).join('');
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const deepClone = o => JSON.parse(JSON.stringify(o));

function fmtTime(sec, tenths = true) {
  const neg = sec < 0; sec = Math.abs(sec);
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60), t = Math.floor((sec * 10) % 10);
  return (neg ? '-' : '') + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + (tenths ? '.' + t : '');
}
function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) + ' ' +
    d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}
function fmtBytes(n) {
  if (n == null) return '—';
  const u = ['B', 'KB', 'MB', 'GB']; let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(i ? 1 : 0) + ' ' + u[i];
}
function safeFileName(s) { return (s || 'untitled').replace(/[\\/:*?"<>|]+/g, '_').trim().slice(0, 80) || 'untitled'; }

/* ---------- WAV ---------- */
/** channels: Float32Array[]; bits: 16 | 24 | 32 (32 = IEEE float) */
function encodeWav(channels, sampleRate, bits = 16) {
  const nCh = channels.length, len = channels[0].length;
  const bps = bits / 8, blockAlign = nCh * bps, dataSize = len * blockAlign;
  const buf = new ArrayBuffer(44 + dataSize), v = new DataView(buf);
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); v.setUint32(4, 36 + dataSize, true); ws(8, 'WAVE');
  ws(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, bits === 32 ? 3 : 1, true);
  v.setUint16(22, nCh, true); v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * blockAlign, true);
  v.setUint16(32, blockAlign, true); v.setUint16(34, bits, true);

    for (let c = 0; c < nCh; c++) {
      let s = channels[c][i];

}
/** Returns {sampleRate, channels: Float32Array[]} — supports PCM 8/16/24/32 and float 32/64. */
function decodeWav(arrayBuffer) {
  const v = new DataView(arrayBuffer);
  const str = (o, n) => { let s = ''; for (let i = 0; i < n; i++) s += String.fromCharCode(v.getUint8(o + i)); return s; };
  if (arrayBuffer.byteLength < 12 || str(0, 4) !== 'RIFF' || str(8, 4) !== 'WAVE') throw new Error('Not a WAV file');
  let o = 12, fmt = null, data = null;
  while (o + 8 <= v.byteLength) {
    const id = str(o, 4), size = v.getUint32(o + 4, true);
    if (id === 'fmt ') fmt = { format: v.getUint16(o + 8, true), ch: v.getUint16(o + 10, true), sr: v.getUint32(o + 12, true), bits: v.getUint16(o + 22, true) };
    else if (id === 'data') { data = { off: o + 8, size: Math.min(size, v.byteLength - o - 8) }; }
    o += 8 + size + (size & 1);
  }
  if (!fmt || !data) throw new Error('WAV is missing fmt or data chunk');

  if (format === 0xFFFE) format = fmt.bits >= 32 && fmt.bits !== 24 ? 3 : 1; // extensible: best guess

  let p = data.off;
  for (let i = 0; i < n; i++) for (let c = 0; c < fmt.ch; c++) {
    let s;
    if (format === 3) s = bps === 4 ? v.getFloat32(p, true) : v.getFloat64(p, true);
    else if (bps === 1) s = (v.getUint8(p) - 128) / 128;
    else if (bps === 2) s = v.getInt16(p, true) / 32768;
    else if (bps === 3) { let x = v.getUint8(p) | (v.getUint8(p + 1) << 8) | (v.getUint8(p + 2) << 16); if (x & 0x800000) x |= ~0xffffff; s = x / 8388608; }

/* ---------- ZIP (store writer, store/deflate reader) ---------- */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

function zipStore(entries) {

  const dosDate = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  for (const e of entries) {
    const name = enc.encode(e.name);
    const data = typeof e.data === 'string' ? enc.encode(e.data) : e.data instanceof Uint8Array ? e.data : new Uint8Array(e.data);
    const crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(lh.buffer, name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(ch.buffer, name);
    offset += 30 + name.length + data.length;

  const cdSize = central.reduce((s, p) => s + (p.byteLength ?? p.length), 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end.buffer], { type: 'application/zip' });
}

/** ArrayBuffer → Map(name → Uint8Array). Verifies CRC. */
async function unzip(buf) {
  const v = new DataView(buf), u8 = new Uint8Array(buf);

    if (v.getUint32(p, true) !== 0x02014b50) throw new Error('Zip central directory is corrupted.');
    const method = v.getUint16(p + 10, true), crc = v.getUint32(p + 16, true), csize = v.getUint32(p + 20, true), usize = v.getUint32(p + 24, true);
    const nl = v.getUint16(p + 28, true), xl = v.getUint16(p + 30, true), cl = v.getUint16(p + 32, true), lo = v.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nl));

    async listJournals() { return getAll('journalMeta'); },
    async readJournal(recId) {

    clearJournal: recId => tx(['journal', 'journalMeta'], 'readwrite', s => { s.journalMeta.delete(recId); s.journal.delete(IDBKeyRange.bound([recId, 0], [recId, Infinity])); }),

    const wantDrums = p.drums.on;
    const ciEnd = this.countInEnd;
    if (!wantClick && !wantDrums && !(ciEnd > -Infinity)) return;
    for (const pass of this.passes) {
      const a = Math.max(ca, pass.ctxStart), b = Math.min(cb, pass.ctxEnd);
      if (b <= a) continue;
      const tlA = pass.tlStart + (a - pass.ctxStart), tlB = pass.tlStart + (b - pass.ctxStart);
      for (const ev of gridEvents(p, tlA, tlB, wantClick, wantDrums, ciEnd)) {
        const when = pass.ctxStart + (ev.t - pass.tlStart);
        const nodes = ev.click
          ? Synth.click(c, this.clickBus, when, ev.accent, p.click.sound, p.click.vol)
          : Synth.drum(c, this.drumBus, ev.inst, when, ev.vel);
        nodes.forEach(n => this.live.push({ src: n, g: null, end: when + 0.5 }));
        if (ev.click && ev.t < ciEnd) this.emit('countin', { when, beatsLeft: Math.round((ciEnd - ev.t) / beatDur(p)) });
      }
    }
  }

  _silenceLive(at) {
    for (const n of this.live) {
      try {
        if (n.g) { n.g.gain.cancelScheduledValues(at); n.g.gain.setTargetAtTime(0, at, 0.0015); n.src.stop(at + 0.012); }
        else n.src.stop(at);
      } catch (_) { }
    }
    this.live = [];
  }
  /** Clip edits during playback: re-schedule from "now" (keeps the timeline mapping). */
  refresh() {
    if (this.state === 'stopped') return;
    const at = this.ctx.currentTime + 0.03;
    const old = this.live; this.live = [];
    for (const n of old) {
      if (!n.g) { this.live.push(n); continue; } // keep metronome/drum hits
      try { n.g.gain.cancelScheduledValues(at); n.g.gain.setTargetAtTime(0, at, 0.0015); n.src.stop(at + 0.012); } catch (_) { }
    }
    for (const pass of this.passes) if (pass.ctxEnd > at) this._schedulePass(pass, at);
  }
  /** Loop / tempo change during playback: start a fresh pass from the current position. */
  retime() {
    if (this.state === 'stopped') return;
    const at = this.ctx.currentTime + 0.04;
    let pos = this.position() + 0.04;
    const loop = this._loopActive() ? this.project.loop : null;
    if (loop && (pos >= loop.end || pos < loop.start) && this.state !== 'recording') pos = loop.start;
    this._silenceLive(at);
    const lastIdx = this.passes.length - 1;
    if (lastIdx >= 0) { const lp = this.passes[lastIdx]; if (lp.ctxStart <= at) { lp.tlEnd = lp.tlStart + (at - lp.ctxStart); lp.ctxEnd = at; } }
    this.passes = this.passes.filter(pp => pp.ctxStart < at);
    if (this.rec) this.rec.passes = this.passes;
    this._addPass(at, pos);
    this.gridUntil = at;
  }

  /** Stop initiated by the engine itself (device lost, interruption): the app receives the take via 'autostop'. */
  async autoStop() {
    if (this.state === 'stopped') return;
    const pos = this.position(), start = this.playStart;
    const res = await this.stop();
    this.emit('autostop', { res, pos, start });
  }
  async stop() {
    if (this.state === 'stopped') return null;
    const now = this.ctx.currentTime;
    const pos = this.position();
    this.ticker.postMessage(0);
    let result = null;
    if (this.state === 'recording') result = await this._finishRecording(now);
    this._silenceLive(this.ctx.currentTime);
    this.passes = [];
    this.state = 'stopped';
    this.lastStopPos = pos;
    this.emit('state', this.state);
    return result;
  }

  /* ---------- recording ---------- */
  async record(from) {
    const p = this.project;
    const armed = p.tracks.map((t, i) => t.arm ? i : -1).filter(i => i >= 0);
    if (!armed.length) throw new Error('Arm a track first (tap R on a track).');
    await this.ensureInput();
    if (this.state === 'recording') return null;
    if (this.state === 'playing') return this._punchIn(armed);
    const missing = await this.loadProjectAudio(p);
    if (missing.length) this.emit('error', `${missing.length} recording(s) could not be loaded from storage.`);
    let punch = from != null ? from : p.position;
    if (this._loopActive() && (punch < p.loop.start || punch >= p.loop.end)) punch = p.loop.start;
    const ci = Math.max(0, p.click.countIn | 0) * barDur(p);
    const recId = uid('r_');
    this.rec = {
      recId, projectId: p.id, tracks: armed.map(i => ({ track: i, input: p.tracks[i].input })), punch,
      lat: this.inputLatency(), sr: this.ctx.sampleRate, chunks: [], seq: 0, journaled: 0, capturedFrames: 0,
      loop: this._loopActive() ? { start: p.loop.start, end: p.loop.end } : null, startedAt: Date.now(), clipped: false,
    };
    this.capture.port.postMessage({ cmd: 'start' });
    this.playStart = punch;
    this.state = 'recording';
    this._startTransport(punch - ci, { countInEnd: ci > 0 ? punch : -Infinity });
    this.rec.passes = this.passes; // shared reference; passes are appended as loops proceed
    this.rec.journalTimer = setInterval(() => this._journalFlush().catch(e => this.emit('error', 'Could not write the recording safety journal: ' + e.message)), 1500);
    this.emit('state', this.state);
    return { punch, countIn: ci };
  }
  /** Punch in while already playing: no count-in, recording starts at the current position. */
  _punchIn(armed) {
    const p = this.project, punch = this.position() + 0.05;
    this.rec = {
      recId: uid('r_'), projectId: p.id, tracks: armed.map(i => ({ track: i, input: p.tracks[i].input })), punch,
      lat: this.inputLatency(), sr: this.ctx.sampleRate, chunks: [], seq: 0, journaled: 0, capturedFrames: 0,
      loop: this._loopActive() ? { start: p.loop.start, end: p.loop.end } : null, startedAt: Date.now(), clipped: false,
    };
    this.capture.port.postMessage({ cmd: 'start' });
    this.rec.passes = this.passes;
    this.countInEnd = -Infinity;
    this.state = 'recording';
    this.rec.journalTimer = setInterval(() => this._journalFlush().catch(e => this.emit('error', 'Could not write the recording safety journal: ' + e.message)), 1500);
    this.emit('state', this.state);
    return { punch, countIn: 0 };
  }
  recordingDuration() {
    if (!this.rec) return 0;
    return Math.max(0, this.position() - this.rec.punch);
  }
  _journalMeta() {
    const r = this.rec;
    return { recId: r.recId, projectId: r.projectId, tracks: r.tracks, punch: r.punch, lat: r.lat, sr: r.sr, loop: r.loop, startedAt: r.startedAt, passes: r.passes.map(p => ({ ...p, tlEnd: isFinite(p.tlEnd) ? p.tlEnd : null, ctxEnd: isFinite(p.ctxEnd) ? p.ctxEnd : null })) };
  }
  async _journalFlush() {
    const r = this.rec; if (!r) return;
    const fresh = r.chunks.slice(r.journaled);
    r.journaled = r.chunks.length;
    const recs = fresh.map(c => ({ recId: r.recId, seq: r.seq++, frame: c.frame, l: c.l.buffer.slice(0), r: c.r ? c.r.buffer.slice(0) : null }));
    await Store.putJournal(this._journalMeta(), recs);
  }
  async _finishRecording(stopCtx) {
    const r = this.rec;
    clearInterval(r.journalTimer);
    // ask the worklet to flush, and wait for the last chunk
    await new Promise(res => { r.onStopped = res; this.capture.port.postMessage({ cmd: 'stop' }); setTimeout(res, 1500); });
    // drop loop passes scheduled ahead but never reached, then close the last pass at the stop time
    // (+latency, so the tail of the performance that was still "in flight" is kept)
    const endT = stopCtx + r.lat;
    r.passes = r.passes.filter(pp => pp.ctxStart < endT);
    const lp = r.passes[r.passes.length - 1];
    if (lp && (!isFinite(lp.ctxEnd) || lp.ctxEnd > endT)) { lp.tlEnd = lp.tlStart + (endT - lp.ctxStart); lp.ctxEnd = endT; lp.closed = true; }
    this.rec = null;
    let result;
    try { await this._journalFlushFinal(r); } catch (e) { /* journal is best-effort; we still hold the audio in memory */ }
    result = assembleRecording(r.chunks.map(c => ({ frame: c.frame, l: c.l, r: c.r })), r);
    this.lastGaps = result.frameGaps; result.recId = r.recId; result.clipped = r.clipped; result.loop = r.loop; result.sr = r.sr;
    return result;
  }
  async _journalFlushFinal(r) {
    const fresh = r.chunks.slice(r.journaled);
    const recs = fresh.map(c => ({ recId: r.recId, seq: r.seq++, frame: c.frame, l: c.l.buffer.slice(0), r: c.r ? c.r.buffer.slice(0) : null }));
    const meta = { recId: r.recId, projectId: r.projectId, tracks: r.tracks, punch: r.punch, lat: r.lat, sr: r.sr, loop: r.loop, startedAt: r.startedAt, passes: r.passes.map(p => ({ ...p, tlEnd: isFinite(p.tlEnd) ? p.tlEnd : null, ctxEnd: isFinite(p.ctxEnd) ? p.ctxEnd : null })) };
    await Store.putJournal(meta, recs);
  }

  /* ---------- live waveform for the take being recorded ---------- */
  livePeaks() {
    const r = this.rec; if (!r || !r.chunks.length) return null;
    if (!r.live) r.live = { peaks: [], done: 0, acc: [0, 0], cnt: 0, frame0: r.chunks[0].frame };
    const L = r.live;
    for (; L.done < r.chunks.length; L.done++) {
      const d = r.chunks[L.done].l;
      for (let i = 0; i < d.length; i++) { const s = d[i]; if (s < L.acc[0]) L.acc[0] = s; if (s > L.acc[1]) L.acc[1] = s; if (++L.cnt === PEAK_BLOCK) { L.peaks.push(L.acc[0], L.acc[1]); L.acc = [0, 0]; L.cnt = 0; } }
    }
    // map: frame0 → timeline (first pass)
    const t0 = L.frame0 / r.sr - r.lat;
    let pass = r.passes[0]; for (const ps of r.passes) if (ps.ctxStart <= t0) pass = ps;
    const tl0 = pass.tlStart + (t0 - pass.ctxStart);
    return { tl0, peaks: L.peaks, block: PEAK_BLOCK, sr: r.sr, punch: r.punch };
  }

  /* ---------- offline render (export) ---------- */
  /** opts: {tracks:[i..], drums:bool, stem:bool (ignore mute/solo), end:sec, sampleRate} → AudioBuffer (stereo) */
  async render(opts) {
    const p = this.project;
    await this.loadProjectAudio(p);
    const sr = opts.sampleRate || (this.ctx ? this.ctx.sampleRate : 48000);
    const len = Math.max(1, Math.ceil(opts.end * sr));
    const c = new OfflineAudioContext({ numberOfChannels: 2, length: len, sampleRate: sr });
    const master = c.createGain(); master.gain.value = p.master.vol; master.connect(c.destination);
    const revIn = c.createGain(), conv = c.createConvolver(); conv.buffer = Synth.impulse(c, p.master.reverbSize);
    revIn.connect(conv).connect(master);
    const anySolo = p.tracks.some(t => t.solo);
    const D = this.procDelay != null ? this.procDelay : await measureStripDelay(sr);
    const pass = { ctxStart: -D, tlStart: 0, tlEnd: opts.end, ctxEnd: opts.end - D };
    const sink = [];
    for (const tr of opts.tracks) {
      const t = p.tracks[tr];
      const audible = opts.stem ? true : (!t.mute && (!anySolo || t.solo));
      if (!audible) continue;
      const strip = buildStrip(c, master, revIn); strip.update(t, true, 0, 0);
      for (const seg of trackSegments(p, tr)) {
        const take = activeTake(seg.clip), buf = this.buffers.get(take.audioId);
        if (buf) this._scheduleSegment(c, strip.input, buf, take.srcStart, seg.from, seg.to, pass, 0, sink);
      }
    }
    if (opts.drums && p.drums.on) {
      const bus = c.createGain(); bus.gain.value = p.drums.vol; bus.connect(master);
      for (const ev of gridEvents(p, 0, opts.end, false, true, -Infinity)) Synth.drum(c, bus, ev.inst, ev.t, ev.vel);
    }
    return c.startRendering();
  }
}

/** Channel strips contain a DynamicsCompressor, which has a fixed look-ahead delay (≈6 ms in Chromium/WebKit).
 *  We measure it once and schedule track audio that much earlier, so what you hear (and export) sits exactly on the timeline. */
async function measureStripDelay(sr) {
  try {
    const n = 4096, c = new OfflineAudioContext({ numberOfChannels: 1, length: n, sampleRate: sr });
    const b = c.createBuffer(1, 64, sr); b.getChannelData(0)[0] = 1;
    const s = c.createBufferSource(); s.buffer = b;
    const rev = c.createGain();
    const strip = buildStrip(c, c.destination, rev);
    strip.update({ vol: 1, pan: 0, fx: { lowcut: false, low: 0, mid: 0, high: 0, comp: 0, reverb: 0 } }, true, 0, 0);
    s.connect(strip.input); s.start(0);
    const out = (await c.startRendering()).getChannelData(0);
    let mi = 0; for (let i = 1; i < n; i++) if (Math.abs(out[i]) > Math.abs(out[mi])) mi = i;
    return mi / sr;
  } catch (_) { return 0; }
}

/** Musical grid events in [tlA, tlB). Clicks during count-in always sound. Drums don't play during count-in. */
function gridEvents(p, tlA, tlB, wantClick, wantDrums, countInEnd) {
  const out = [], bd = beatDur(p), bar = barDur(p);
  for (let k = Math.ceil(tlA / bd - 1e-9); k * bd < tlB - 1e-9; k++) {
    const t = k * bd;
    const inCount = t < countInEnd - 1e-6;
    if (wantClick || inCount) {
      const ib = ((k % p.tsNum) + p.tsNum) % p.tsNum;
      out.push({ t, click: true, accent: ib === 0 });
    }
  }
  if (wantDrums) {
    const hits = Synth.barHits(p.drums.pattern, p.tsNum, p.tsDen);
    for (let b = Math.floor(tlA / bar) - 1; b * bar < tlB; b++) {
      for (const h of hits) {
        const t = b * bar + h.pos * bd;
        if (t >= tlA - 1e-9 && t < tlB - 1e-9 && t >= 0 && !(t < countInEnd - 1e-6)) out.push({ t, inst: h.inst, vel: h.vel });
      }
    }
  }
  return out;
}

/**
 * Turn raw captured chunks into takes.
 * meta: {tracks:[{track,input}], punch, lat, sr, passes:[{ctxStart, tlStart, tlEnd, ctxEnd}], loop}
 * returns {tracks: [{track, takes:[{srcStart, data:Float32Array, complete}]}]}
 */
function assembleRecording(chunks, meta) {
  const out = { tracks: meta.tracks.map(t => ({ track: t.track, takes: [] })) };
  if (!chunks.length) return out;
  chunks.sort((a, b) => a.frame - b.frame);
  let gaps = 0; for (let i = 1; i < chunks.length; i++) if (chunks[i].frame !== chunks[i - 1].frame + chunks[i - 1].l.length) gaps++;
  out.frameGaps = gaps;
  const base = chunks[0].frame, lastC = chunks[chunks.length - 1];
  const total = lastC.frame + lastC.l.length - base;
  const L = new Float32Array(total); let R = null;
  for (const c of chunks) {
    const o = c.frame - base; if (o < 0 || o >= total) continue;
    L.set(c.l.subarray(0, Math.min(c.l.length, total - o)), o);
    if (c.r) { if (!R) R = new Float32Array(total); R.set(c.r.subarray(0, Math.min(c.r.length, total - o)), o); }
  }
  const { sr, lat, punch } = meta;
  const minLen = Math.round(0.15 * sr);
  const passes = meta.passes.map(p => ({ ...p, tlEnd: p.tlEnd == null ? Infinity : p.tlEnd, ctxEnd: p.ctxEnd == null ? Infinity : p.ctxEnd }));
  meta.tracks.forEach((tdef, ti) => {
    let mono;
    if (!R || tdef.input === 'L') mono = L;
    else if (tdef.input === 'R') mono = R;
    else { mono = new Float32Array(total); for (let i = 0; i < total; i++) mono[i] = (L[i] + R[i]) * 0.5; }
    passes.forEach((ps, k) => {
      // sample index i ↔ context time (base+i)/sr; performer-time = that − lat
      const idx = ctxT => Math.ceil((ctxT + lat) * sr - base - 1e-6);
      let i0 = idx(ps.ctxStart);
      if (punch > ps.tlStart) i0 = Math.max(i0, idx(ps.ctxStart + (punch - ps.tlStart)));
      let i1 = isFinite(ps.ctxEnd) ? idx(ps.ctxEnd) : total;
      const complete = i0 >= 0 && i1 <= total && !ps.closed;
      i0 = Math.max(0, i0); i1 = Math.min(total, i1);
      if (i1 - i0 < minLen) return;
      const srcStart = ps.tlStart + ((base + i0) / sr - lat - ps.ctxStart);
      out.tracks[ti].takes.push({ srcStart, data: mono.slice(i0, i1), complete: meta.loop ? complete : true });
    });
  });
  return out;
}

<script>
'use strict';
/* ===== Core operations shared by the app and the test harness ===== */

/** Persist the audio of a finished recording, then insert takes into the project.
 *  Audio is written (transaction complete) BEFORE the project references it. */
async function commitRecording(engine, p, result, sr) {
  const clips = [];
  for (const tr of result.tracks) {
    if (!tr.takes.length) continue;
    const stored = [];
    for (const tk of tr.takes) {
      const audioId = uid('a_');
      const peaks = computePeaks(tk.data, PEAK_BLOCK);
      await Store.putAudio({ id: audioId, projectId: p.id, sr, length: tk.data.length, data: tk.data.buffer.slice(tk.data.byteOffset, tk.data.byteOffset + tk.data.byteLength), peaks: peaks.buffer, created: Date.now() });
      engine.addBuffer(audioId, tk.data, sr, peaks);
      stored.push({ audioId, srcStart: tk.srcStart, length: tk.data.length / sr, complete: tk.complete });
    }
    const clip = addRecordedTakes(p, tr.track, stored, { loop: result.loop });
    if (clip) clips.push(clip);
  }
  return clips;
}

/** Rebuild takes from an interrupted recording's journal. */
async function recoverJournal(meta) {
  const rows = await Store.readJournal(meta.recId);
  const chunks = rows.map(r => ({ frame: r.frame, l: new Float32Array(r.l), r: r.r ? new Float32Array(r.r) : null }));
  const res = assembleRecording(chunks, meta);
  res.loop = meta.loop;
  return res;
}

/** Remove audio records that the project no longer references (call only when no undo history exists). */
async function collectGarbage(p) {
  const keep = referencedAudio(p);
  const keys = await Store.audioKeysFor(p.id);
  const dead = keys.filter(k => !keep.has(k));
  if (dead.length) await Store.deleteAudio(dead);
  return dead.length;
}

/* ---------- backup package (.4track.zip) ---------- */
async function exportProjectPackage(p) {
  const entries = [];
  const audioIds = [...referencedAudio(p)];
  const manifest = { format: 'pocket-four-track', formatVersion: FORMAT_VERSION, appVersion: APP_VERSION, exported: new Date().toISOString(), projectId: p.id, name: p.name, audio: [] };
  for (const id of audioIds) {
    const rec = await Store.getAudio(id);
    if (!rec) throw new Error('A recording is missing from storage; the backup would be incomplete. (' + id + ')');
    const wav = encodeWav([new Float32Array(rec.data)], rec.sr, 32);
    entries.push({ name: `audio/${id}.wav`, data: new Uint8Array(wav) });
    manifest.audio.push({ id, file: `audio/${id}.wav`, sampleRate: rec.sr, frames: rec.length, crc32: crc32(new Uint8Array(rec.data)) });
  }
  const proj = deepClone(p);
  entries.unshift({ name: 'project.json', data: JSON.stringify(proj, null, 2) });
  entries.unshift({ name: 'manifest.json', data: JSON.stringify(manifest, null, 2) });
  entries.push({ name: 'README.txt', data: `Pocket Four-Track project backup\n\nProject: ${p.name}\nExported: ${manifest.exported}\nFormat version: ${FORMAT_VERSION}\n\nproject.json holds the arrangement (tracks, clips, takes, settings).\naudio/*.wav are the original recordings (32-bit float, mono). Every take's\nposition on the song timeline is takes[].srcStart (seconds) in project.json.\nImport this whole .zip in Pocket Four-Track > Projects > Import backup.\n` });
  return zipStore(entries);
}

/** Parse + validate a backup. Returns {manifest, project, audio: Map(id → {sr, data})} or throws a clear error. */
async function readProjectPackage(arrayBuffer) {
  let files;
  try { files = await unzip(arrayBuffer); } catch (e) { throw new Error('This file is not a readable project backup. ' + e.message); }
  const dec = new TextDecoder();
  if (!files.has('manifest.json') || !files.has('project.json')) throw new Error('This zip is not a Pocket Four-Track backup (manifest.json/project.json missing).');
  let manifest, project;
  try { manifest = JSON.parse(dec.decode(files.get('manifest.json'))); project = JSON.parse(dec.decode(files.get('project.json'))); }
  catch (_) { throw new Error('The backup\'s project data is damaged and cannot be read.'); }
  if (manifest.format !== 'pocket-four-track') throw new Error('Unknown backup format.');
  if (manifest.formatVersion > FORMAT_VERSION) throw new Error(`This backup was made by a newer version (format ${manifest.formatVersion}). Please update the app.`);
  if (!project.id || !Array.isArray(project.clips)) throw new Error('The backup\'s project data is incomplete.');
  const audio = new Map(), problems = [];
  for (const id of referencedAudio(project)) {
    const f = files.get(`audio/${id}.wav`);
    if (!f) { problems.push(id); continue; }
    try {
      const w = decodeWav(f.buffer.slice(f.byteOffset, f.byteOffset + f.byteLength));
      audio.set(id, { sr: w.sampleRate, data: w.channels[0] });
    } catch (e) { problems.push(id); }
  }
  return { manifest, project, audio, problems };
}

/** Store an imported package as a project. mode: 'copy' (new ids) | 'replace' */
async function importProjectPackage(pkg, mode, newName) {
  const p = normalizeProject(deepClone(pkg.project));
  const idMap = new Map();
  if (mode === 'copy') {
    p.id = uid('p_');
    for (const id of pkg.audio.keys()) idMap.set(id, uid('a_'));
  } else {
    await Store.deleteProject(p.id);
  }
  // drop takes whose audio is missing (reported to the user)
  p.clips.forEach(c => { c.takes = c.takes.filter(t => pkg.audio.has(t.audioId)); });
  p.clips = p.clips.filter(c => c.takes.length);
  p.clips.forEach(c => { if (!c.takes.some(t => t.id === c.active)) c.active = c.takes[c.takes.length - 1].id; c.takes.forEach(t => { if (idMap.has(t.audioId)) t.audioId = idMap.get(t.audioId); }); });
  if (newName) p.name = newName;
  p.modified = Date.now(); p.opened = Date.now();
  for (const [id, a] of pkg.audio) {
    const nid = idMap.get(id) || id;
    await Store.putAudio({ id: nid, projectId: p.id, sr: a.sr, length: a.data.length, data: a.data.buffer.slice(a.data.byteOffset, a.data.byteOffset + a.data.byteLength), peaks: computePeaks(a.data, PEAK_BLOCK).buffer, created: Date.now() });
  }
  await Store.saveProject(p);
  return p;
}

/** Duplicate a project including copies of all its audio. */
async function duplicateProject(src) {
  const p = deepClone(src);
  p.id = uid('p_'); p.name = src.name + ' (copy)'; p.created = p.modified = p.opened = Date.now();
  const idMap = new Map();
  for (const id of referencedAudio(src)) {
    const rec = await Store.getAudio(id); if (!rec) continue;
    const nid = uid('a_'); idMap.set(id, nid);
    await Store.putAudio({ ...rec, id: nid, projectId: p.id });
  }
  p.clips.forEach(c => c.takes.forEach(t => { t.audioId = idMap.get(t.audioId) || t.audioId; }));
  await Store.saveProject(p);
  return p;

    for (const meta of metas) {

      const rows = await Store.readJournal(meta.recId);
      const frames = rows.reduce((s, r) => s + r.l.byteLength / 4, 0);
      if (!proj || frames < meta.sr * 0.2) { await Store.clearJournal(meta.recId); continue; }
      const ok = await this.confirm(`An unfinished recording was found: ${fmtTime(frames / meta.sr)} on ${meta.tracks.map(t => proj.tracks[t.track].name).join(' + ')} in "${proj.name}" (${fmtDate(meta.startedAt)}). The app may have closed while recording. Recover it as a new take?`, 'Recover take');

        try {
          if (this.project.id !== proj.id) await this.openProject(proj.id);
          const res = await recoverJournal(meta);
          res.recId = meta.recId; res.sr = meta.sr;
          await this.handleRecording(res);
        } catch (e) { this.toast('Recovery failed: ' + e.message, { err: true }); }

  },

        h('div', { class: 'row' }, h('span', { class: 'lbl' }, 'Manual value (ms)'), manIn),

  /* ================= transport + keys ================= */
  bindTransport() {
    const press = (id, fn) => { const el = $(id); el.addEventListener('click', () => { this.haptic(); fn(); }); };

    press('#kPause', () => this.pause());
    press('#kStop', () => this.stop());
    press('#kRec', () => this.record());

    press('#kFf', () => this.jump(1));

  bindKeys() {
    document.addEventListener('keydown', e => {
      if (e.target.matches('input[type=text],input[type=search],input[type=number],textarea,select')) return;
      if (!$('#sheetHost').hidden && e.key === 'Escape') { this.closeSheet(); return; }
      const mod = e.ctrlKey || e.metaKey, k = e.key;
      if (mod && (k === 'z' || k === 'Z')) { e.preventDefault(); e.shiftKey ? this.redo() : this.undo(); return; }
      if (mod && k === 'y') { e.preventDefault(); this.redo(); return; }
      if (mod || e.altKey) return;
      const map = {
        ' ': () => this.engine.isRunning() ? this.pause() : this.play(),
        r: () => this.record(), s: () => this.stop(), p: () => this.pause(),
        Enter: () => this.seek(0), Home: () => this.seek(0),
        ArrowLeft: () => this.jump(-1), ArrowRight: () => this.jump(1),
        l: () => this.toggleLoop(), m: () => $('#btnClick').click(), d: () => this.drumsSheet(), k: () => this.addMarker(),
        b: () => this.clipAction('split'), Delete: () => this.clipAction('delete'), Backspace: () => this.clipAction('delete'),

        1: () => this.toggleArm(0), 2: () => this.toggleArm(1), 3: () => this.toggleArm(2), 4: () => this.toggleArm(3),
      };
      const f = map[k] || map[k.toLowerCase && k.toLowerCase()];
      if (f && $('#sheetHost').hidden) { e.preventDefault(); f(); }
    });
  },
